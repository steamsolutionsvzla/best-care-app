<!-- src/app/perfil/cambiar-contrasena/cambiar-contrasena.page.html -->
<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Cambiar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="cambiar-contrasena-content" [fullscreen]="true">

  <span class="cambiar-contrasena-eyebrow">Seguridad</span>
  <div class="cambiar-contrasena-card">
    <ion-item class="bc-input" lines="none">
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-input label="Nueva contraseña" labelPlacement="floating" [type]="showPassword ? 'text' : 'password'"
        autocomplete="new-password" [(ngModel)]="newPassword"></ion-input>
      <button type="button" class="bc-input__toggle" slot="end" (click)="showPassword = !showPassword">
        <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
      </button>
    </ion-item>

    <ion-item class="bc-input" lines="none">
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-input label="Confirmar contraseña" labelPlacement="floating"
        [type]="showConfirmPassword ? 'text' : 'password'" autocomplete="new-password"
        [(ngModel)]="confirmPassword"></ion-input>
      <button type="button" class="bc-input__toggle" slot="end"
        (click)="showConfirmPassword = !showConfirmPassword">
        <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
      </button>
    </ion-item>
  </div>

  <ion-text color="danger" *ngIf="errorMessage()">
    <p class="error-text">{{ errorMessage() }}</p>
  </ion-text>

  <ion-button expand="block" class="shadow-btn" [disabled]="submitting()" (click)="onSave()">
    <ion-spinner *ngIf="submitting()" name="crescent"></ion-spinner>
    <span *ngIf="!submitting()">Actualizar contraseña</span>
  </ion-button>

</ion-content>
